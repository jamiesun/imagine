# Global defaults. output_dir is used when --output is omitted; concurrency = 0
# means auto-select based on the selected model's endpoint count.
#
# Model names are dynamic: the table key under [models."..."] is what you pass
# to `-m` / `"model"` in batch jobs. Prefer `imagine models` to discover them.
output_dir = "~/.imagine/outputs"
concurrency = 0

[models."MAI-Image-2.6"]
backend = "openai_image"
api_model = "MAI-Image-2.6"

[[models."MAI-Image-2.6".endpoints]]
base_url = "https://jettai2.services.ai.azure.com/mai/v1/images/generations"
api_key_env = "AZURE_OPENAI_APIKEY"
auth = "bearer"

# Second endpoint example for concurrent fan-out (optional).
[[models."MAI-Image-2.6".endpoints]]
base_url = "https://jettai2.services.ai.azure.com/mai/v1/images/generations"
api_key_env = "AZURE_OPENAI_APIKEY_2"
auth = "bearer"

[models."MAI-Image-2.6".defaults]
size = "1024x1024"
output_format = "png"
output_compression = 100
quality = "high"

[models."MAI-Image-2.5"]
backend = "openai_image"
api_model = "MAI-Image-2.5"

[[models."MAI-Image-2.5".endpoints]]
base_url = "https://jettai2.services.ai.azure.com/mai/v1/images/generations"
api_key_env = "AZURE_OPENAI_APIKEY"
auth = "bearer"

[models."MAI-Image-2.5".defaults]
size = "1024x1024"
output_format = "png"
output_compression = 100
quality = "high"

[models."MAI-Image-2.6-Flash"]
backend = "openai_image"
api_model = "MAI-Image-2.6-Flash"

[[models."MAI-Image-2.6-Flash".endpoints]]
base_url = "https://jettai2.services.ai.azure.com/mai/v1/images/generations"
api_key_env = "AZURE_OPENAI_APIKEY"
auth = "bearer"

[models."MAI-Image-2.6-Flash".defaults]
size = "1024x1024"
output_format = "png"
output_compression = 100
quality = "high"

# --- Local Qwen-Image-2.1 (optional) -----------------------------------------
# Install the local server first (see integrations/qwen-image/README.md):
#   integrations/qwen-image/install.sh --prefetch
#   qwen-image-server
# Local servers take no credential, so auth = "none" needs no key.
