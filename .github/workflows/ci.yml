name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  # Must match vendor/resvg/resvg.h (RESVG_VERSION there) and release.yml.
  RESVG_VERSION: v0.47.0

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Test
        run: zig build test

  svg:
    name: svg overlay (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build resvg C API (static)
        shell: bash
        env:
          RUSTFLAGS: -C panic=abort
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/resvg"
          lib="$src/target/release"
          curl -sSL --retry 3 --retry-delay 2 \
            "https://codeload.github.com/linebender/resvg/tar.gz/refs/tags/${RESVG_VERSION}" -o "$RUNNER_TEMP/resvg.tgz"
          mkdir -p "$src"
          tar xzf "$RUNNER_TEMP/resvg.tgz" -C "$src" --strip-components=1
          cargo build --release -p resvg-capi --manifest-path "$src/Cargo.toml"
          # Zig ships no libgcc_eh for the musl/mingw targets and rustc leaves
          # the unwinder to the final link; keep it next to libresvg.a.
          cp "$(dirname "$(gcc -print-libgcc-file-name)")/libgcc_eh.a" "$lib/"
          ls -l "$lib" | grep -iE "resvg|gcc"

      - name: Build & test with SVG support
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/resvg"
          args="-Doptimize=ReleaseSafe -Dsvg-overlay=true -Dresvg-include=$src/crates/c-api -Dresvg-lib=$src/target/release -Dresvg-libs=gcc_eh"
          zig build test $args
          zig build $args

      - name: Smoke test svg/text/compose
        shell: bash
        run: |
          set -euo pipefail
          # Self-containment check: without the resvg tree on disk (and thus no
          # usable rpath) the binary must still render.
          mv "$RUNNER_TEMP/resvg" "$RUNNER_TEMP/resvg.hidden"
          cat > "$RUNNER_TEMP/badge.svg" <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><circle cx="60" cy="60" r="54" fill="#2563eb"/><text x="60" y="70" font-size="28" text-anchor="middle" fill="#fff">svg</text></svg>
          SVG
          zig-out/bin/imagine svg render --input "$RUNNER_TEMP/badge.svg" -o "$RUNNER_TEMP/badge.png" --width 120
          zig-out/bin/imagine text render --text "resvg linked" -o "$RUNNER_TEMP/text.png" --width 300 --size 28
          zig-out/bin/imagine png compose --base "$RUNNER_TEMP/badge.png" --layer "$RUNNER_TEMP/text.png,x=0,y=0" -o "$RUNNER_TEMP/composed.png"
          ls -l "$RUNNER_TEMP/badge.png" "$RUNNER_TEMP/text.png" "$RUNNER_TEMP/composed.png"

  e2e:
    name: end-to-end (mock providers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      # Drives the real client path (create -> poll -> download, file writes,
      # --json output) against scripts/mock_providers.py: no network, no keys.
      - name: End-to-end
        run: scripts/e2e.sh zig-out/bin/imagine

  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check formatting
        run: zig fmt --check build.zig src
