name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  # Must match vendor/resvg/resvg.h (RESVG_VERSION there).
  RESVG_VERSION: v0.47.0

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Released binaries ship with SVG/text render + PNG compose enabled:
          # resvg's C API is a Rust staticlib, so it is built from source on a
          # native runner per target (cross-linking it is not practical).
          - asset: imagine-linux-x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            zig_target: x86_64-linux-musl
            gcc: musl-gcc
            svg: true
          - asset: imagine-linux-aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            zig_target: aarch64-linux-musl
            gcc: musl-gcc
            svg: true
          - asset: imagine-macos-x86_64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            zig_target: x86_64-macos
            svg: true
          - asset: imagine-macos-aarch64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            zig_target: aarch64-macos
            svg: true
          - asset: imagine-windows-x86_64.exe
            runner: windows-latest
            rust_target: x86_64-pc-windows-gnu
            zig_target: x86_64-windows
            gcc: x86_64-w64-mingw32-gcc
            svg: true
          # resvg cannot be cross-built for aarch64 Windows here, so this asset
          # stays SVG-free (documented in the release notes).
          - asset: imagine-windows-aarch64.exe
            runner: ubuntu-latest
            rust_target: ''
            zig_target: aarch64-windows
            svg: false
    steps:
      # workflow_dispatch builds the tagged source, not the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag matches src/version.zig
        shell: bash
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          ver="$(sed -n 's/.*string *= *"\([^"]*\)".*/\1/p' src/version.zig | head -n1)"
          echo "tag=$tag  version.zig=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag ($tag) does not match src/version.zig ($ver). Bump src/version.zig before tagging."
            exit 1
          fi

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Rust
        if: matrix.svg
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install musl toolchain
        if: matrix.svg && contains(matrix.rust_target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The GNU Windows target must compile any C shim with mingw's gcc, not
      # MSVC's cl.exe, or the archive will not link with zig's mingw target.
      - name: Put mingw first for the GNU Windows target
        if: matrix.svg && matrix.rust_target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"

      - name: Build resvg C API (static)
        if: matrix.svg
        shell: bash
        env:
          # Panics abort instead of unwinding across the C ABI, and it drops
          # almost every libgcc unwinder reference from the archive.
          RUSTFLAGS: -C panic=abort
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/resvg"
          lib="$src/target/${{ matrix.rust_target }}/release"
          curl -sSL --retry 3 --retry-delay 2 \
            "https://codeload.github.com/linebender/resvg/tar.gz/refs/tags/${RESVG_VERSION}" -o "$RUNNER_TEMP/resvg.tgz"
          mkdir -p "$src"
          # Relative paths on purpose: GNU tar on Windows reads "D:\..." as a
          # remote host spec.
          ( cd "$RUNNER_TEMP" && tar xzf resvg.tgz -C resvg --strip-components=1 )
          cargo build --release -p resvg-capi --manifest-path "$src/Cargo.toml" --target "${{ matrix.rust_target }}"
          # Zig ships no DWARF unwinder (libgcc_eh) for musl/mingw targets and
          # rustc leaves those references to the final link, so fold the
          # toolchain's libgcc into the archive.
          if [ -n "${{ matrix.gcc }}" ]; then
            gcc_lib="$(${{ matrix.gcc }} -print-libgcc-file-name)"
            echo "merging $gcc_lib into libresvg.a"
            mkdir -p "$lib/merge"
            ( cd "$lib/merge" && ar x ../libresvg.a && ar x "$gcc_lib" && ar rcs ../libresvg.a ./*.o )
            rm -rf "$lib/merge"
          fi
          ls -l "$lib" | grep -i resvg

      - name: Build imagine
        shell: bash
        run: |
          set -euo pipefail
          args="-Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast -Dstrip=true"
          if [ "${{ matrix.svg }}" = "true" ]; then
            src="$RUNNER_TEMP/resvg"
            args="$args -Dsvg-overlay=true -Dresvg-include=$src/crates/c-api -Dresvg-lib=$src/target/${{ matrix.rust_target }}/release"
          fi
          echo "zig build $args"
          zig build $args

      - name: Smoke test SVG support
        if: matrix.svg && matrix.asset != 'imagine-windows-aarch64.exe'
        shell: bash
        run: |
          set -euo pipefail
          bin=zig-out/bin/imagine
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" version
          cat > "$RUNNER_TEMP/badge.svg" <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120"><circle cx="60" cy="60" r="54" fill="#2563eb"/><text x="60" y="70" font-size="28" text-anchor="middle" fill="#fff">svg</text></svg>
          SVG
          "$bin" svg render --input "$RUNNER_TEMP/badge.svg" -o "$RUNNER_TEMP/badge.png" --width 120
          "$bin" text render --text "resvg linked" -o "$RUNNER_TEMP/text.png" --width 300 --size 28
          "$bin" png compose --base "$RUNNER_TEMP/badge.png" --layer "$RUNNER_TEMP/text.png,x=0,y=0" -o "$RUNNER_TEMP/composed.png"
          ls -l "$RUNNER_TEMP/badge.png" "$RUNNER_TEMP/text.png" "$RUNNER_TEMP/composed.png"

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [ -f zig-out/bin/imagine.exe ]; then
            cp zig-out/bin/imagine.exe "dist/${{ matrix.asset }}"
          else
            cp zig-out/bin/imagine "dist/${{ matrix.asset }}"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 1

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package archives, skill + checksums
        shell: bash
        run: |
          chmod +x dist/imagine-*
          tar -czf dist/imagine-skill.tar.gz -C skills imagine
          for target in imagine-linux-x86_64 imagine-linux-aarch64 imagine-macos-x86_64 imagine-macos-aarch64; do
            tar -czf "dist/${target}.tar.gz" -C dist "$target" -C "$GITHUB_WORKSPACE" skills
          done
          ( cd dist && sha256sum imagine-* > SHA256SUMS )
          echo "=== release assets ===" && ls -la dist

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: imagine ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install

            ### Homebrew (macOS / Linux)

            ```sh
            brew install talkincode/tap/imagine
            ```

            ### Linux / macOS — one-liner:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Windows — download `imagine-windows-x86_64.exe` (or `-aarch64`) below and put it on your `PATH`.

            ### What's in the binaries

            `svg render`, `text render` and `png compose` are **enabled by default** in
            every released binary except `imagine-windows-aarch64.exe` (resvg has no
            cross-buildable aarch64 Windows static library; that asset stays SVG-free).

            ### Assets
            | Platform | File | SVG support |
            |----------|------|-------------|
            | Linux x86_64 | `imagine-linux-x86_64`, `imagine-linux-x86_64.tar.gz` | yes |
            | Linux arm64 | `imagine-linux-aarch64`, `imagine-linux-aarch64.tar.gz` | yes |
            | macOS x86_64 | `imagine-macos-x86_64`, `imagine-macos-x86_64.tar.gz` | yes |
            | macOS arm64 | `imagine-macos-aarch64`, `imagine-macos-aarch64.tar.gz` | yes |
            | Windows x86_64 | `imagine-windows-x86_64.exe` | yes |
            | Windows arm64 | `imagine-windows-aarch64.exe` | no |
            | Agent skill | `imagine-skill.tar.gz` | — |

            Verify downloads against `SHA256SUMS`.
          files: |
            dist/imagine-linux-x86_64
            dist/imagine-linux-aarch64
            dist/imagine-macos-x86_64
            dist/imagine-macos-aarch64
            dist/imagine-linux-x86_64.tar.gz
            dist/imagine-linux-aarch64.tar.gz
            dist/imagine-macos-x86_64.tar.gz
            dist/imagine-macos-aarch64.tar.gz
            dist/imagine-windows-x86_64.exe
            dist/imagine-windows-aarch64.exe
            dist/imagine-skill.tar.gz
            dist/SHA256SUMS

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: talkincode/homebrew-tap
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render and push formula
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${REF#refs/tags/}"
          TAG="${TAG#refs/heads/}"
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          mkdir -p dist
          curl -fsSL "${BASE_URL}/SHA256SUMS" -o dist/SHA256SUMS
          CHECKSUMS="dist/SHA256SUMS"

          sha() {
            local hash
            hash="$(awk -v f="$1" '$2 == f || $2 == "*"f { print $1; exit }' "$CHECKSUMS")"
            [ -n "$hash" ] || { echo "missing checksum for $1" >&2; exit 1; }
            echo "$hash"
          }

          MACOS_ARM64_SHA="$(sha imagine-macos-aarch64.tar.gz)"
          MACOS_AMD64_SHA="$(sha imagine-macos-x86_64.tar.gz)"
          LINUX_ARM64_SHA="$(sha imagine-linux-aarch64.tar.gz)"
          LINUX_AMD64_SHA="$(sha imagine-linux-x86_64.tar.gz)"

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/imagine.rb <<EOF
          class Imagine < Formula
            desc "Universal image-generation CLI for AI agents"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/imagine-macos-aarch64.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              else
                url "${BASE_URL}/imagine-macos-x86_64.tar.gz"
                sha256 "${MACOS_AMD64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE_URL}/imagine-linux-aarch64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              else
                url "${BASE_URL}/imagine-linux-x86_64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install Dir["imagine-*"].find { |f| File.file?(f) } => "imagine"
              pkgshare.install "skills" if File.directory?("skills")
            end

            def caveats
              <<~EOS
                The agent skill has been installed to:
                  #{opt_pkgshare}/skills/imagine

                To use it with your AI agent, link or copy it to your skills folder:
                  mkdir -p ~/.agents/skills
                  cp -R #{opt_pkgshare}/skills/imagine ~/.agents/skills/
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/imagine version")
            end
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/imagine.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${VERSION}"
          else
            git commit -m "imagine ${VERSION}"
            git push
          fi

      - name: Skip notice
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        run: echo "HOMEBREW_TAP_TOKEN secret is not configured; skipping Homebrew tap update."
